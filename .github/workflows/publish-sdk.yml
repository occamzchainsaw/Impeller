# Publishes Impeller.Plugins.Sdk and Impeller.Plugins.Abstractions to nuget.org.
#
# Separate from release.yml and separately tagged, because the SDK is versioned independently of the
# engine on purpose: a plugin is built once against an SDK version and keeps working across engine
# updates. Tying them together would invalidate every plugin's package reference on every engine
# release, for nothing.
#
#   git tag sdk-v0.1.0 && git push origin sdk-v0.1.0
#
# There is no API key. nuget.org issues a one-hour key in exchange for a signed token GitHub mints
# for this specific repository and this specific workflow file, so there is no long-lived secret to
# leak, rotate or forget. It also means renaming this file breaks publishing until the policy on
# nuget.org is updated to match — which is the point of it being named there.

name: Publish SDK

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      # Without this the OIDC token request fails silently and the login step gets no key.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Only for a tag push. A manual dispatch runs against a branch, whose name is never going to
      # equal a version, so applying this there would make the manual trigger permanently broken.
      - name: Check the tag matches the packages' version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^sdk-v', ''
          $version = (dotnet msbuild src/Impeller.Plugins.Sdk/Impeller.Plugins.Sdk.csproj `
              -getProperty:Version -p:Configuration=Release -v:q).Trim()

          if ($tag -ne $version) {
              # Worth stopping for. A version pushed to nuget.org can never be replaced or reused,
              # only unlisted, so publishing the wrong number burns it permanently.
              throw "tag $tag does not match the SDK version $version"
          }

      - name: Test
        run: dotnet test Impeller.slnx -c Release --nologo

      # The sample builds against the packed package rather than a project reference, so this proves
      # the thing about to be published is usable by somebody outside this repository.
      - name: Pack, and build the sample against the result
        shell: pwsh
        run: ./scripts/pack-sdk.ps1

      # Last, and deliberately: the key it hands back lives for an hour, so asking for it before a
      # slow build risks it expiring before the push.
      - name: Get a short-lived key from nuget.org
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        shell: pwsh
        run: |
          # Enumerated rather than globbed. PowerShell does not expand wildcards in arguments to a
          # native program, so "artifacts/packages/*.nupkg" arrives at dotnet as a literal path and
          # fails with "File does not exist" - which reads exactly like nothing having been packed.
          $packages = Get-ChildItem artifacts/packages -Filter *.nupkg

          if (-not $packages) { throw 'nothing was packed' }

          foreach ($package in $packages) {
              Write-Host "Pushing $($package.Name)..."

              # --skip-duplicate so a re-run after a partial failure is not itself a failure: the
              # abstractions package may already be up when the SDK push is retried.
              dotnet nuget push $package.FullName `
                  --source https://api.nuget.org/v3/index.json `
                  --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
                  --skip-duplicate

              if ($LASTEXITCODE -ne 0) { throw "push failed: $($package.Name)" }
          }
